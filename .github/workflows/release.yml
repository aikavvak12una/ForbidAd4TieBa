name: Build signed release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/fa4tb-release.jks

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for secret in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              printf '::error::Missing repository secret: %s\n' "$secret"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ORG_GRADLE_PROJECT_RELEASE_STORE_FILE"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Locate and verify signed APK
        id: apk
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path('app/build/outputs/apk/release')
          metadata = json.loads((output / 'output-metadata.json').read_text(encoding='utf-8'))
          elements = metadata['elements']
          if len(elements) != 1:
              raise SystemExit('Expected one release APK for the configured ABI')
          apk = output / elements[0]['outputFile']
          apksigner = Path(os.environ['ANDROID_HOME']) / 'build-tools/37.0.0/apksigner'
          subprocess.run([str(apksigner), 'verify', '--verbose', str(apk)], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'path={apk.as_posix()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write(f'Signed release APK: `{apk.name}`\n')
          PY

      - name: Upload APK directly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f -- "$ORG_GRADLE_PROJECT_RELEASE_STORE_FILE"

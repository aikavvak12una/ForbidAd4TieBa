name: Build signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_PLATFORM: "37.0"
      ANDROID_BUILD_TOOLS: "37.0.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        shell: bash
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager --channel=3 \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Restore release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "${RELEASE_KEYSTORE_BASE64}" ]] || missing+=(RELEASE_KEYSTORE_BASE64)
          [[ -n "${RELEASE_STORE_PASSWORD}" ]] || missing+=(RELEASE_STORE_PASSWORD)
          [[ -n "${RELEASE_KEY_ALIAS}" ]] || missing+=(RELEASE_KEY_ALIAS)
          [[ -n "${RELEASE_KEY_PASSWORD}" ]] || missing+=(RELEASE_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "${RELEASE_KEYSTORE_BASE64}" \
            | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          chmod 600 "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK
        shell: bash
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          mapfile -t apks < <(
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print
          )
          if (( ${#apks[@]} != 1 )); then
            printf 'Expected exactly one release APK, found %d\n' "${#apks[@]}" >&2
            exit 1
          fi

          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" \
            verify --verbose --print-certs "${apks[0]}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FA4TB-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/release.keystore"
